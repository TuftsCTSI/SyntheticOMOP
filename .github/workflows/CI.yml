name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1.11.6"

      - uses: julia-actions/cache@v3.2.0

      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project test/runtests.jl

